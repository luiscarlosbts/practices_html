<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Form</title>
</head>
<body bgcolor="#f0f0f0">
    <table border="1" align="center">
        <form action="file1.html" method="get">
            <tr>
                <th colspan="4" align="center" bgcolor="#00adbf">Formulario Consulta Médica</th>
            </tr>
            <tr>
                <td bgcolor="#00c5ff" align="right"><label for="name">Nombre(s):</label></td>
                <td><input type="text" name="name" id="name" placeholder="Nombre(s)" required></td>
                <td bgcolor="#00c5ff" align="right"><label for="lstname">Apellido(s):</label></td>
                <td><input type="text" name="lstname" id="lstname" placeholder="Apellido(s)" required></td>
            </tr>
            <tr>
                <td bgcolor="#00c5ff" align="right"><label for="edad">Edad:</label></td><td><input type="number" name="edad" id="edad"></td>
                <td bgcolor="#00c5ff" align="right"><label for="sexo">Sexo:</label></td>
                <td><select required name="sexo" id="sexo">
                    <option value="" disabled selected>Selecciona sexo</option>
                    <option value="hombre">Hombre</option>
                    <option value="mujer">Mujer</option>
                </select></td>
            </tr>
            <tr>
                <td bgcolor="#00c5ff" align="right"><label for="mail">Correo Electrónico:</label></td>
                <td><input type="email" name="mail" id="mail" placeholder="Correo"></td>
                <td bgcolor="#00c5ff" align="right"><label for="tel">Teléfono:</label></td>
                <td><input type="text" name="tel" id="tel" placeholder="Teléfono" required></td>
            </tr>
            <tr>
                <td colspan="2" align="right" bgcolor="#00c5ff"><label>Seleccione fecha de la cita:</label></td>
                <td colspan="2" align="center"><input type="datetime-local" name="fecha" id="fecha" required></td>
            </tr>
            <tr>
                <td colspan="4" align="center" bgcolor="#00c5ff"><label>Síntomas:</label></td>
            </tr>
            <tr>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="DolorCabeza">Dolor de Cabeza</td>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="DolorEstomago">Dolor de Estómago</td>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="Mareos">Mareos</td>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="Bomito">Bómito</td>
            </tr>
            <tr>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="DolorGarganta">Dolor de Garganta</td>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="DolorOidos">Dolor de Oídos</td>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="DolorPecho">Dolor de Pecho</td>
                <td align="center"><input type="checkbox" name="sintoma" id="sintoma" value="DolorEspalda">Dolor de Espalda</td>
            </tr>
            <tr>
                <td bgcolor="#00c5ff" align="right"><label for="alergia">Alergia(s):</label></td>
                <td><label>Sí</label><input type="radio" name="alergia" value="true">
                <label>No</label><input type="radio" name="alergia" value="false"></td>
                <td bgcolor="#00c5ff" align="right"><label for="discapacidad">Discapacidad(es):</label></td>
                <td><label>Sí</label><input type="radio" name="discapacidad" value="true">
                <label>No</label><input type="radio" name="discapacidad" value="false"></td>
            </tr>
            <tr>
                <td colspan="4" bgcolor="#00c5ff" align="center"><label>Por favor especifique alérgias, discapacidades u otros detalles:</label></td>
            </tr>
            <tr>
                <td colspan="4" align="center"><textarea name="detalles" id="detalles" placeholder="Especifique aquí alérgias, discapacidades u otros detalles"></textarea></td>
            </tr>
            <tr>
                <td colspan="4" align="center" bgcolor="#00c5ff"><label>Motivo de la cita:</label></td>
            </tr>
            <tr>
                <td align="center"><input type="checkbox" name="motivo" id="motivo" value="Consulta">Consulta</td>
                <td align="center"><input type="checkbox" name="motivo" id="motivo" value="Emergencia">Emergencia</td>
                <td align="center"><input type="checkbox" name="motivo" id="motivo" value="Seguimiento">Cita de Seguimiento</td>
                <td align="center"><input type="checkbox" name="motivo" id="motivo" value="Otro">Otro</td>

            </tr>
            <tr>
                <td colspan="4" rowspan="4" align="center"><button type="submit">Enviar</button><button type="reset">Resetear</button></td>
            </tr>
    </table>
</body>
</html>
