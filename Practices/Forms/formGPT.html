<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Consulta Médica</title>
</head>
<body bgcolor="#f0f0f0">
    <form action="confirmation.html" method="get">
        <table border="1" align="center" cellspacing="0" cellpadding="10">
            <thead>
                <tr>
                    <!-- Modificación: Se añadió un título más específico y claro al formulario -->
                    <th colspan="4" align="center" bgcolor="#00adbf" style="color: white;">Formulario de Consulta Médica</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <!-- Modificación: Se añadió el atributo "required" a los campos Nombre y Apellido para hacerlos obligatorios -->
                    <td bgcolor="#00c5ff" align="right"><label for="name">Nombre(s):</label></td>
                    <td><input type="text" name="name" id="name" placeholder="Nombre(s)" required></td>
                    <td bgcolor="#00c5ff" align="right"><label for="lstname">Apellido(s):</label></td>
                    <td><input type="text" name="lstname" id="lstname" placeholder="Apellido(s)" required></td>
                </tr>
                <tr>
                    <!-- Modificación: Se añadió el atributo "min" al campo Edad para evitar edades negativas -->
                    <td bgcolor="#00c5ff" align="right"><label for="edad">Edad:</label></td>
                    <td><input type="number" name="edad" id="edad" min="0" required></td>
                    <!-- Modificación: Se añadió un campo de selección para "Sexo" con el atributo "required" -->
                    <td bgcolor="#00c5ff" align="right"><label for="sexo">Sexo:</label></td>
                    <td>
                        <select name="sexo" id="sexo" required>
                            <option value="" disabled selected>Selecciona sexo</option>
                            <option value="hombre">Hombre</option>
                            <option value="mujer">Mujer</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <!-- Modificación: Se añadió el atributo "required" al correo electrónico para asegurar que se ingrese un correo válido -->
                    <td bgcolor="#00c5ff" align="right"><label for="mail">Correo Electrónico:</label></td>
                    <td><input type="email" name="mail" id="mail" placeholder="Correo Electrónico" required></td>
                    <!-- Modificación: Se cambió el tipo de campo a "tel" y se añadió un patrón para mejorar la validación del teléfono -->
                    <td bgcolor="#00c5ff" align="right"><label for="tel">Teléfono:</label></td>
                    <td><input type="text" name="tel" id="tel" placeholder="Teléfono" pattern="[0-9]{10}" required></td>
                </tr>
                <tr>
                    <!-- Modificación: Se utilizó el campo "datetime-local" para la fecha de la cita -->
                    <td bgcolor="#00c5ff" align="right"><label for="fecha">Fecha de la Cita:</label></td>
                    <td colspan="3"><input type="datetime-local" name="fecha" id="fecha" required></td>
                </tr>
                <tr>
                    <td colspan="4" align="center" bgcolor="#00c5ff">
                        <!-- Modificación: Se reorganizó la forma en que los checkboxes están agrupados para los síntomas -->
                        <label for="sintomas">Síntomas:</label><br>
                        <label><input type="checkbox" name="sintomas" value="DolorCabeza"> Dolor de Cabeza</label>
                        <label><input type="checkbox" name="sintomas" value="DolorEstomago"> Dolor de Estómago</label>
                        <label><input type="checkbox" name="sintomas" value="Mareos"> Mareos</label>
                        <label><input type="checkbox" name="sintomas" value="Vomito"> Vómito</label><br>
                        <label><input type="checkbox" name="sintomas" value="DolorGarganta"> Dolor de Garganta</label>
                        <label><input type="checkbox" name="sintomas" value="DolorOidos"> Dolor de Oídos</label>
                        <label><input type="checkbox" name="sintomas" value="DolorPecho"> Dolor de Pecho</label>
                        <label><input type="checkbox" name="sintomas" value="DolorEspalda"> Dolor de Espalda</label>
                    </td>
                </tr>
                <tr>
                    <!-- Modificación: Se añadió "checked" para que la opción "No" esté seleccionada por defecto en las preguntas de alergias y discapacidades -->
                    <td bgcolor="#00c5ff" align="right"><label for="alergia">¿Tienes alergia(s)?</label></td>
                    <td>
                        <label><input type="radio" name="alergia" value="true"> Sí</label>
                        <label><input type="radio" name="alergia" value="false"> No</label>
                    </td>
                    <td bgcolor="#00c5ff" align="right"><label for="discapacidad">¿Tienes discapacidad(s)?</label></td>
                    <td>
                        <label><input type="radio" name="discapacidad" value="true"> Sí</label>
                        <label><input type="radio" name="discapacidad" value="false"> No</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="4" align="center" bgcolor="#00c5ff"><label for="detalles">Especifica alérgias, discapacidades u otros detalles:</label></td>
                </tr>
                <tr>
                    <!-- Modificación: Se añadió un área de texto para ingresar detalles adicionales como alérgias o discapacidades -->
                    <td colspan="4" align="center"><textarea name="detalles" id="detalles" placeholder="Especifique aquí alérgias, discapacidades u otros detalles"></textarea></td>
                </tr>
                <tr>
                    <td colspan="4" align="center" bgcolor="#00c5ff"><label for="motivo">Motivo de la cita:</label></td>
                </tr>
                <tr>
                    <td colspan="4" align="center">
                        <!-- Modificación: Se reorganizó y simplificó la presentación de los motivos de la cita utilizando checkboxes -->
                        <label><input type="checkbox" name="motivo" value="Consulta"> Consulta</label>
                        <label><input type="checkbox" name="motivo" value="Emergencia"> Emergencia</label>
                        <label><input type="checkbox" name="motivo" value="Seguimiento"> Cita de Seguimiento</label>
                        <label><input type="checkbox" name="motivo" value="Otro"> Otro</label>
                    </td>
                </tr>
                <tr>
                    <!-- Modificación: Se añadió un botón de "Resetear" junto al de "Enviar" -->
                    <td colspan="4" align="center">
                        <button type="submit">Enviar</button>
                        <button type="reset">Resetear</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </form>
</body>
