<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
</head>
<body bgcolor="#A52A2A">

    <!-- Contenedor principal del formulario -->
    <div style="text-align: center;">
        <table width="100%" align="center">
            <tr>
                <td width="50%">
                    <!-- Formulario de inicio de sesión -->
                    <form action="inicio.html" method="post" autocomplete="on">
                        <h1>Bienvenido a [Nombre del restaurante]</h1>
                        <h1>Inicia sesión</h1>

                        <!-- Sección de credenciales -->
                        <section>
                            <div>
                                <label for="username">Nombre de usuario o correo:</label><br>
                                <input type="text" id="username" name="username" required autocomplete="username">
                            </div>
                            <br>

                            <div>
                                <label for="password">Contraseña:</label><br>
                                <input type="password" id="password" name="password" required minlength="6" maxlength="20" pattern=".*[!@#$%^&*].*">
                            </div>
                        </section>
                        <br>

                        <!-- Sección de opciones adicionales -->
                        <section>
                            <div>
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember">Recordar contraseña</label>
                            </div>
                        </section>
                        <br>

                        <!-- Sección de botones -->
                        <section>
                            <div>
                                <input type="submit" value="Iniciar sesión">
                                <input type="reset" value="Borrar datos">
                            </div>
                        </section>
                    </form>

                    <!-- Enlace a la página de registro -->
                    <p>¿No tienes cuenta? <a href="signup.html">Regístrate</a></p>
                </td>
                <td width="50%">
                    <img src="https://milrecetas.net/wp-content/uploads/2016/09/Tacos-al-pastor-2.jpg" alt="Imagen de comida" width="100%">
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
